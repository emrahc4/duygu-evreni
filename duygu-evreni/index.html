    <div id="particles-js"></div>

    <section id="display-screen" class="screen"> <div class="controls"> <button id="back-to-feelings-button" title="Geri Dön"> <svg viewBox="0 0 24 24" fill="currentColor"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg> </button> <button id="pause-resume-button" data-status="playing" title="Duraklat"> <svg class="icon-pause" viewBox="0 0 24 24" fill="currentColor"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg> <svg class="icon-play" style="display: none;" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg> </button> <button id="like-button" title="Favorilere Ekle" style="display: none;"> <svg class="like-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg> </button> <button id="copy-quote-button" title="Sözü Kopyala" style="display: none;"> <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg> </button> </div> </section>
